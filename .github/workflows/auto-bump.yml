name: auto-version-bump

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: auto-bump-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Determine base and head
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo "")"
            HEAD="$(git rev-parse HEAD)"
          fi
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "head=$HEAD" >> $GITHUB_OUTPUT

      - name: List changed files
        id: files
        shell: bash
        run: |
          BASE="${{ steps.range.outputs.base }}"
          HEAD="${{ steps.range.outputs.head }}"
          if [ -z "$BASE" ]; then
            echo "changed=" >> $GITHUB_OUTPUT
            echo "no base" && exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | sort | uniq)
          echo "changed<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Classify changes
        id: classify
        shell: bash
        run: |
          CHANGED="${{ steps.files.outputs.changed }}"
          CODE=0
          DOCS=0
          HYGIENE=0
          while IFS= read -r f; do
            case "$f" in
              src/*|scripts/*)
                CODE=1
                ;;
              Docs/*|README*|LICENSE*)
                DOCS=1
                ;;
              .gitignore|.github/*)
                HYGIENE=1
                ;;
            esac
          done <<< "$CHANGED"
          # For PRs from feature branches always treat as code-relevant
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.head_ref }}" != "main" ]; then
            CODE=1
          fi
          echo "code_changed=$CODE" >> $GITHUB_OUTPUT
          echo "docs_changed=$DOCS" >> $GITHUB_OUTPUT
          echo "hygiene_changed=$HYGIENE" >> $GITHUB_OUTPUT

      - name: Bump version if code changed
        if: steps.classify.outputs.code_changed == '1'
        shell: bash
        run: |
          echo "Code change detected – bumping version"
          npm run version:bump -- patch
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Commit bump
        if: steps.classify.outputs.code_changed == '1'
        shell: bash
        env:
          TRIGGERED: ${{ steps.files.outputs.changed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Genau diese vier Dateien wandern in den Commit. Sie sind es, die das
          # Gate im Body namentlich verlangt — nicht die Dateien, die den Bump
          # ausgeloest haben.
          MIRRORS="VERSION version.lock.json package.json package-lock.json"
          INTRO="Diese automatische Erhoehung hebt die Patchstufe, weil der Aenderungsbereich unter src/ oder scripts/ Code beruehrt. Sie entsteht aus dem Versionierer und nicht von Hand, und sie folgt allein daraus, dass die Versionierung die tatsaechliche Funktionalitaet abbilden soll, nicht aus einer Bewertung einzelner Aenderungen. Der Versionsbot committet als github-actions[bot] und bleibt deshalb ohne Signatur, weil der persoenliche Schluessel nicht im GITHUB_TOKEN liegt; eine behauptete Identitaet waere nicht pruefbar."
          MSG_FILE=$(mktemp)
          {
            echo "chore: auto version bump for code changes"
            echo ""
            echo "$INTRO"
            echo ""
            echo "Geaendert hat dieser Commit genau die Spiegeldateien der Versionsautoritaet."
            for f in $MIRRORS; do
              echo "Die Datei $f wurde vom Versionierer mitgezogen und ist hier nur ein Spiegel."
            done
            echo ""
            echo "Den Bump ausgeloest haben die Code-Dateien des Commits davor, nicht dieser."
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                src/*|scripts/*) echo "Die Datei $f liegt im ausloesenden Bereich." ;;
              esac
            done <<< "$TRIGGERED"
            echo ""
            echo "created by VANNON Volatile Agent Needing No Other Nonsense — Never Overly Nice, Never Average Vibe."
          } > "$MSG_FILE"
          git add $MIRRORS
          git diff --cached --quiet || git commit -q -F "$MSG_FILE"
          git push
