name: auto-version-bump

on:
  push:
    branches: [main]

concurrency:
  group: auto-bump-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Determine base and head
        id: range
        shell: bash
        run: |
          BASE="$(git rev-parse HEAD~1 2>/dev/null || echo "")"
          HEAD="$(git rev-parse HEAD)"
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "head=$HEAD" >> $GITHUB_OUTPUT

      - name: List changed files
        id: files
        shell: bash
        run: |
          BASE="${{ steps.range.outputs.base }}"
          HEAD="${{ steps.range.outputs.head }}"
          if [ -z "$BASE" ]; then
            echo "changed=" >> $GITHUB_OUTPUT
            echo "no base" && exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | sort | uniq)
          echo "changed<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Classify changes
        id: classify
        shell: bash
        run: |
          CHANGED="${{ steps.files.outputs.changed }}"
          CODE=0
          while IFS= read -r f; do
            case "$f" in
              src/*|scripts/*|tools/*)
                CODE=1
                ;;
            esac
          done <<< "$CHANGED"
          echo "code_changed=$CODE" >> $GITHUB_OUTPUT

      - name: Pre-Flight der Doku-Einträge
        if: steps.classify.outputs.code_changed == '1'
        run: |
          # Fail-closed: Ein invalider Metadaten-Block stoppt den Bump, bevor
          # irgendwo geschrieben wird. Die Version bleibt stehen und der Lauf
          # nennt den Eintrag, der meckert.
          npm run gate -- --docs

      - name: Bump version, stamp docs
        if: steps.classify.outputs.code_changed == '1'
        shell: bash
        run: |
          echo "Code change detected – bumping version and stamping docs"
          npm run version:bump -- patch
          npm run docs:sync sync

      - name: Commit bump
        if: steps.classify.outputs.code_changed == '1'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Die Message kommt aus demselben Generator, dessen Regeln das Gate
          # bei jedem Lauf verhängt: Prosa je geänderter Datei, Label allein in
          # der letzten Zeile, fremde Footer vorher gestrippt.
          node scripts/commit-draft.mjs --bump > "$RUNNER_TEMP/commit-msg.txt"
          git add VERSION version.lock.json package.json package-lock.json Docs/ROADMAP_OPEN.md Docs/CHECKPOINTS.md
          git diff --cached --quiet || git commit -q -F "$RUNNER_TEMP/commit-msg.txt"
          git push
