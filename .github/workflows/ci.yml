name: ci

on:
  push:
    branches: [main]
  pull_request:

# Das Gate liest nur; keine der beiden Workflows braucht Schreibrechte.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Zwei Jobs, nicht einer: die Waechter lesen Text und brauchen keinen Browser,
  # der Slice faehrt das Spiel. Ein gebrochener Commit-Body faellt deshalb nach
  # Sekunden auf und nicht erst hinter einem Chromium-Download. Beide Jobs
  # laufen gleichzeitig; die Wanduhr bleibt die des Slice.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Basisrevision ermitteln
        id: baseline
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Globale Version und Hard Caps
        env:
          BASE: ${{ steps.baseline.outputs.base }}
        run: |
          if [ -n "$BASE" ]; then
            npm run gate -- --version --base="$BASE"
          else
            npm run gate -- --version
          fi
          npm run gate -- --tree
          npm run gate -- --docs
          if [ -n "$BASE" ]; then
            npm run gate -- --spiegel --base="$BASE"
          else
            npm run gate -- --spiegel
          fi

      - name: Commit-Regeln im Änderungsbereich
        env:
          BASE: ${{ steps.baseline.outputs.base }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BASE" ]; then
            npm run gate -- --commits="$BASE..$HEAD_SHA"
          else
            echo "Keine Basisrevision vorhanden; erster Commit wird nicht verglichen."
          fi

      - name: Commit-Gate-Regeln selbst prüfen
        run: npm run verify:commits

  # Der Volllauf: dieselbe Zeile wie `npm run verify` lokal, ungekuerzt und mit
  # Browser. Er ist absichtlich nicht nach Gruppen teilbar — eine Abnahme, die
  # man unterlaufen kann, ist keine.
  slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      # Der Browser ist rund 114 MB und aendert sich nur mit der Playwright-
      # Fassung. Der Schluessel nennt deshalb playwright-core und NICHT den
      # Lock: der Versions-Bot schreibt package-lock.json bei jedem Push neu
      # (die Version steht darin), ein Schluessel darauf traefe nie. Die
      # Systempakete holt --with-deps weiter in jedem Lauf.
      - name: Browser-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Browser für die Startprüfung
        run: npx playwright install --with-deps chromium

      # Die lokale Last ist gedeckelt: schwere Gruppen und neun Sekunden. Der
      # Volllauf gehoert der CI und wird hier ausdruecklich verlangt — so kann
      # ein spaeterer Griff in die lokalen Skripte die Abnahme nicht weich fahren.
      - name: Slice-Prüfungen
        env:
          DL_LAST: voll
        run: npm run verify

      - name: Produktionsbuild
        run: npm run build
